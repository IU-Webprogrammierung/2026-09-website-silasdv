<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking | SilasDV's Video Game Ranking</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="ranking.css">
    <script src="navigation.js" defer></script>
    <script src="loader.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <a href="#main-content">Skip to main content</a>

    <header>
        <p>
            <a href="index.html" class="site-name">SilasDV's Video Game Ranking</a>
        </p>
    </header>

    <main id="main-content" tabindex="-1">
        <section>
            <h1>All Games</h1>
            <p>Here you will find my personal game ranking. Use the search, filters and sorting to explore the list.</p>
            <p>All playtimes are estimates based on my own experience.</p>
        </section>

        <section>
            <h2>My Ranking</h2>

            <form class="ranking-search" role="search" hidden>
                <label for="game-search">Search games</label>
                <input type="search" id="game-search" name="title"
                       placeholder="Enter a game title" aria-controls="ranking-list">

                <div class="ranking-filters">
                    <div class="ranking-control">
                        <label for="platform-filter">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                                 aria-hidden="true" focusable="false">
                                <rect x="3" y="4" width="18" height="12" rx="2"></rect>
                                <path d="M12 16v4M8 20h8"></path>
                            </svg>
                            <span class="control-label">Platform</span>
                        </label>
                        <select id="platform-filter" name="platform" title="Platform"
                                aria-controls="ranking-list">
                            <option value="">All platforms</option>
                        </select>
                    </div>

                    <div class="ranking-control">
                        <label for="genre-filter">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                                 aria-hidden="true" focusable="false">
                                <path d="m21 12-9 9-9-9V3h9Z"></path>
                                <circle cx="7.5" cy="7.5" r="1"></circle>
                            </svg>
                            <span class="control-label">Genre</span>
                        </label>
                        <select id="genre-filter" name="genre" title="Genre"
                                aria-controls="ranking-list">
                            <option value="">All genres</option>
                        </select>
                    </div>

                    <div class="ranking-control">
                        <label for="game-sort">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                                 aria-hidden="true" focusable="false">
                                <path d="M8 4v16m-4-4 4 4 4-4M16 20V4m-4 4 4-4 4 4"></path>
                            </svg>
                            <span class="control-label">Sort by</span>
                        </label>
                        <select id="game-sort" name="sort" title="Sort by"
                                aria-controls="ranking-list">
                            <option value="rank:asc">Rank: best first</option>
                            <option value="rank:desc">Rank: reversed</option>
                            <option value="playtime_hours:desc">Playtime: longest first</option>
                            <option value="playtime_hours:asc">Playtime: shortest first</option>
                            <option value="release_year:desc">Year: newest first</option>
                            <option value="release_year:asc">Year: oldest first</option>
                            <option value="title:asc">Title: A–Z</option>
                            <option value="title:desc">Title: Z–A</option>
                        </select>
                    </div>
                </div>

                <p id="selection-summary" class="selection-summary"></p>
            </form>

            <p id="data-status" role="status"></p>
            <noscript><p>Please enable JavaScript to view the ranking.</p></noscript>
            <ol id="ranking-list"></ol>
        </section>
    </main>

    <footer hidden></footer>
</body>
</html>
